
name: Build Java JAR

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Example.java
        run: javac Example.java

      - name: Package JAR
        run: jar cfe Example.jar Example *.class

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Example-JAR
          path: Example.jar
